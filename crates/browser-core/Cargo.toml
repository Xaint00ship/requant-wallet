[package]
name = "requant-browser-core"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
requant-wallet-portable = { path = "../../vendor/wallet" }
requant-consensus = { path = "../../vendor/consensus" }
ed25519-dalek = { version = "=2.2.0", features = ["zeroize"] }
getrandom = { version = "=0.2.15", features = ["js"] }
serde_json = "=1.0.140"
hex = "0.4"
zeroize = "=1.9.1"
wasm-bindgen = "=0.2.129"
