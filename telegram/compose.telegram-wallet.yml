services:
  telegram-wallet:
    build: ../wallet/telegram
    restart: unless-stopped
    volumes:
      - ./secrets/telegram-bot-token:/run/secrets/telegram-bot-token:ro
      - telegram-wallet-state:/data
    mem_limit: 320m
    read_only: true
    tmpfs: ["/tmp:mode=1777,size=16m"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    logging: { driver: json-file, options: { max-size: 5m, max-file: "2" } }
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          'fetch("http://127.0.0.1:3313/telegram-wallet-api/health").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))',
        ]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  telegram-wallet-state:
